<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitudes de Faro · FaroLocal Administración</title>
  <meta name="description" content="Revisa las solicitudes de nuevos Faros: enciéndelos o devuélvelos con un motivo.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/nunito-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/acceso.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="../data/seed.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.require("admin", "../");</script>
</head>
<body data-portal="admin" data-base="../">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <main id="contenido" class="contenedor" tabindex="-1"></main>

  <dialog class="dialogo" id="dlg-encender" aria-labelledby="dlg-encender-t">
    <div class="dialogo__cabeza">
      <h2 id="dlg-encender-t">Encender Faro</h2>
      <button class="dialogo__cerrar" type="button" data-cerrar aria-label="Cerrar"><svg class="icono" aria-hidden="true"><use href="../assets/icons/iconos.svg#i-cerrar"></use></svg></button>
    </div>
    <div class="dialogo__cuerpo"><p id="encender-texto"></p></div>
    <div class="dialogo__acciones">
      <button class="boton boton--secundario" type="button" data-cerrar>Todavía no</button>
      <button class="boton boton--primario" type="button" id="encender-confirmar">Sí, encender el Faro</button>
    </div>
  </dialog>

  <dialog class="dialogo" id="dlg-devolver" aria-labelledby="dlg-devolver-t">
    <form id="form-devolver" novalidate>
      <div class="dialogo__cabeza">
        <h2 id="dlg-devolver-t">Devolver con motivo</h2>
        <button class="dialogo__cerrar" type="button" data-cerrar aria-label="Cerrar"><svg class="icono" aria-hidden="true"><use href="../assets/icons/iconos.svg#i-cerrar"></use></svg></button>
      </div>
      <div class="dialogo__cuerpo">
        <p id="devolver-intro"></p>
        <div class="campo">
          <label class="campo__etiqueta" for="d-motivo">Motivo para el titular</label>
          <textarea class="campo__control" id="d-motivo" rows="4" maxlength="300" aria-describedby="d-contador" required></textarea>
          <span class="campo__ayuda" id="d-contador">0 de 300 caracteres. El titular verá este texto tal cual.</span>
        </div>
      </div>
      <div class="dialogo__acciones">
        <button class="boton boton--secundario" type="button" data-cerrar>Cancelar</button>
        <button class="boton boton--cobalto" type="submit" id="devolver-confirmar">Devolver solicitud</button>
      </div>
    </form>
  </dialog>

  <script src="../js/ui.js"></script>
  <script src="../js/campos.js"></script>
  <script src="../js/mapa.js"></script>
  <script src="../js/portal.js"></script>
  <script src="../js/admin-negocios.js"></script>
</body>
</html>
