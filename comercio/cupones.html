<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis cupones · FaroLocal</title>
  <meta name="description" content="Publica y administra los cupones de tu negocio.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/nunito-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/acceso.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="../data/seed.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.require("comercio", "../");</script>
</head>
<body data-portal="comercio" data-base="../">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <main id="contenido" class="contenedor" tabindex="-1"></main>

  <dialog class="dialogo" id="dlg-cupon" aria-labelledby="dlg-cupon-t">
    <form id="form-cupon" novalidate>
      <div class="dialogo__cabeza">
        <h2 id="dlg-cupon-t">Publicar cupón</h2>
        <button class="dialogo__cerrar" type="button" data-cerrar aria-label="Cerrar"><svg class="icono" aria-hidden="true"><use href="../assets/icons/iconos.svg#i-cerrar"></use></svg></button>
      </div>
      <div class="dialogo__cuerpo">
        <div class="alerta alerta--error" id="cupon-error" role="alert" hidden><svg class="icono" aria-hidden="true"><use href="../assets/icons/iconos.svg#i-error"></use></svg><span id="cupon-error-texto"></span></div>
        <div class="campo"><label class="campo__etiqueta" for="c-titulo">Título</label><input class="campo__control" id="c-titulo" type="text" maxlength="120" autocomplete="off" required></div>
        <div class="campo"><label class="campo__etiqueta" for="c-descripcion">Descripción</label><textarea class="campo__control" id="c-descripcion" rows="3" maxlength="400" required></textarea><span class="campo__ayuda">Cuéntale a tu vecino qué recibe y con qué condiciones.</span></div>
        <div class="campo__fila">
          <div class="campo"><label class="campo__etiqueta" for="c-inicio">Empieza el</label><input class="campo__control" id="c-inicio" type="date" required></div>
          <div class="campo"><label class="campo__etiqueta" for="c-fin">Termina el</label><input class="campo__control" id="c-fin" type="date" required></div>
        </div>
      </div>
      <div class="dialogo__acciones">
        <button class="boton boton--secundario" type="button" data-cerrar>Cancelar</button>
        <button class="boton boton--cobalto" type="submit" id="cupon-guardar">Publicar cupón</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialogo" id="dlg-borrar" aria-labelledby="dlg-borrar-t">
    <div class="dialogo__cabeza">
      <h2 id="dlg-borrar-t">¿Eliminar este cupón?</h2>
      <button class="dialogo__cerrar" type="button" data-cerrar aria-label="Cerrar"><svg class="icono" aria-hidden="true"><use href="../assets/icons/iconos.svg#i-cerrar"></use></svg></button>
    </div>
    <div class="dialogo__cuerpo"><p id="borrar-texto"></p></div>
    <div class="dialogo__acciones">
      <button class="boton boton--secundario" type="button" data-cerrar>Mejor no</button>
      <button class="boton boton--peligro" type="button" id="borrar-confirmar">Sí, eliminar</button>
    </div>
  </dialog>

  <script src="../js/ui.js"></script>
  <script src="../js/campos.js"></script>
  <script src="../js/mapa.js"></script>
  <script src="../js/form-negocio.js"></script>
  <script src="../js/portal.js"></script>
  <script src="../js/comercio-cupones.js"></script>
</body>
</html>
