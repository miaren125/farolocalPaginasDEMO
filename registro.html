<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar mi negocio · FaroLocal</title>
  <meta name="description" content="Registra tu negocio en FaroLocal en menos de 5 minutos y enciende tu Faro en el barrio.">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/acceso.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <div class="acceso">
    <div class="acceso__columna">
      <aside class="acceso__marca">
        <a class="acceso__logo" href="index.html" aria-label="FaroLocal, ir al inicio">
          <img src="assets/img/logo-login.png" alt="FaroLocal" width="628" height="222">
        </a>
        <p class="acceso__frase">Enciende tu Faro <span>en menos de 5 minutos.</span></p>
        <div class="acceso__arte">
          <picture>
            <source srcset="assets/img/ilustracion-tienda-login.webp" type="image/webp">
            <img src="assets/img/ilustracion-tienda-login.png" alt="" width="1035" height="1068">
          </picture>
        </div>
      </aside>
    </div>

    <main class="acceso__form" id="contenido">
      <div class="acceso__tarjeta acceso__tarjeta--ancha">
        <h1>Registrar mi negocio</h1>
        <ol class="progreso" aria-label="Progreso del registro">
          <li id="prog-1" aria-current="step">Tu cuenta</li>
          <li id="prog-2">Tu negocio</li>
        </ol>

        <form id="form-registro" novalidate>
          <div class="alerta alerta--error" id="registro-error" role="alert" hidden>
            <svg class="icono" aria-hidden="true"><use href="assets/icons/iconos.svg#i-error"></use></svg>
            <span id="registro-error-texto"></span>
          </div>

          <!-- Paso 1 -->
          <section class="paso" id="paso-1" aria-labelledby="titulo-paso-1">
            <h2 class="paso-titulo" id="titulo-paso-1" tabindex="-1">Paso 1 de 2: Tu cuenta</h2>
            <div class="campo">
              <label class="campo__etiqueta" for="r-nombre">Nombre del titular</label>
              <input class="campo__control" id="r-nombre" type="text" autocomplete="name" required>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="r-correo">Correo electrónico</label>
              <input class="campo__control" id="r-correo" type="email" inputmode="email" autocomplete="email" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="r-telefono">Teléfono</label>
              <input class="campo__control" id="r-telefono" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="10 dígitos" required>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="r-password">Contraseña</label>
              <div class="campo__envoltura">
                <input class="campo__control" id="r-password" type="password" autocomplete="new-password" required>
                <button class="campo__ojo" type="button" data-ver="r-password" aria-pressed="false" aria-controls="r-password" aria-label="Mostrar contraseña">
                  <svg class="icono" aria-hidden="true"><use href="assets/icons/iconos.svg#i-ojo"></use></svg>
                </button>
              </div>
              <span class="campo__ayuda">Mínimo 8 caracteres.</span>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="r-confirmar">Confirmar contraseña</label>
              <div class="campo__envoltura">
                <input class="campo__control" id="r-confirmar" type="password" autocomplete="new-password" required>
                <button class="campo__ojo" type="button" data-ver="r-confirmar" aria-pressed="false" aria-controls="r-confirmar" aria-label="Mostrar contraseña">
                  <svg class="icono" aria-hidden="true"><use href="assets/icons/iconos.svg#i-ojo"></use></svg>
                </button>
              </div>
            </div>
            <div class="acceso__acciones">
              <button class="boton boton--cobalto boton--bloque" type="submit" id="continuar">Continuar</button>
              <a class="boton boton--secundario boton--bloque" href="login.html">Ya tengo cuenta</a>
            </div>
          </section>

          <!-- Paso 2 -->
          <section class="paso" id="paso-2" aria-labelledby="titulo-paso-2" hidden>
            <h2 class="paso-titulo" id="titulo-paso-2" tabindex="-1">Paso 2 de 2: Tu negocio</h2>
            <div id="form-negocio-raiz" class="paso"></div>

            <div class="acceso__acciones acceso__acciones--fila">
              <button class="boton boton--secundario" type="button" id="atras">Atrás</button>
              <button class="boton boton--cobalto" type="submit" id="registrar">Registrar mi negocio</button>
            </div>
          </section>
        </form>
      </div>
    </main>
  </div>

  <script src="data/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/campos.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/form-negocio.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
